const INDICE={};
function indexar(){for(let dt=new Date(INICIO);dt<=FIM;dt.setDate(dt.getDate()+1)){const s=iso(dt);tarefasDoDia(s).forEach(t=>INDICE[t.id]={nome:t.nome,dia:diaNum(s),data:s})}
 PAUTA.forEach(p=>INDICE["plano-reuniao-"+p[0]]={nome:p[1],dia:null});PARCEIRAS.forEach(p=>INDICE["plano-parc-"+p.id]={nome:"Rodízio combinado: "+p.nome,dia:null});}
async function rpc(m,b){const r=await fetch(RPC+m,{method:"POST",headers:{apikey:ANON,Authorization:"Bearer "+ANON,"Content-Type":"application/json"},body:JSON.stringify(b)});if(!r.ok)throw Error(await r.text());return r.json()}
let fila={},timer;
function enfileirar(id){if(!TOKEN)return;fila[id]=1;clearTimeout(timer);timer=setTimeout(enviar,700)}
async function enviar(){const ids=Object.keys(fila);fila={};if(!ids.length)return;
 const rows=ids.map(id=>({item_id:id,status:st(id),obs:obs(id),nome:(INDICE[id]||{}).nome||id,dia:(INDICE[id]||{}).dia??null}));
 const nums=new Set(ids.map(id=>(INDICE[id]||{}).dia).filter(n=>n!==null&&n!==undefined));
 nums.forEach(n=>{let f=0,t=0;Object.entries(INDICE).forEach(([id,v])=>{if(v.data&&v.dia===n){t++;if(st(id)==="feito")f++}});rows.push({item_id:"_dia:"+n,dia:n,nome:"Resumo do dia",status:"inicio",valor:f+"/"+t})});
 try{await rpc("plano_gravar",{p_token:TOKEN,p_itens:rows});syncLabel("● salvo no CRM")}catch(e){syncLabel("⚠ não salvou: confira a internet");ids.forEach(i=>fila[i]=1)}}
async function carregar(){if(!TOKEN){syncLabel("salvo só neste aparelho");return}
 syncLabel("conectando ao CRM…");
 try{const r=await rpc("plano_ler",{p_token:TOKEN});if(!r)throw Error("link");(r.itens||[]).forEach(i=>{if(!i.item_id.startsWith("_"))dados[i.item_id]={s:i.status||"inicio",o:i.obs||""}});salvar();syncLabel("● conectado ao CRM");render()}
 catch(e){syncLabel("⚠ sem conexão com o CRM: o que marcar fica neste aparelho")}}
const app=document.getElementById("app");
function render(){
  document.querySelectorAll("#menu button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.aba===aba));
  app.innerHTML=({hoje:viewHoje,crono:viewCrono,parceiras:viewParceiras,guia:viewGuia,reuniao:viewReuniao,plano:viewPlano}[aba])();
}
document.addEventListener("click",e=>{
  const m=e.target.closest("#menu button"); if(m){aba=m.dataset.aba;render();window.scrollTo(0,0);return}
  const b=e.target.closest(".st button"); if(b){dados[b.dataset.id]={...(dados[b.dataset.id]||{}),s:b.dataset.v};salvar();enfileirar(b.dataset.id);const g=b.parentElement;g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));if(aba==="hoje")render();return}
  const ir=e.target.closest("[data-ir]"); if(ir){const dt=deIso(dia);dt.setDate(dt.getDate()+Number(ir.dataset.ir));dia=iso(dt);render();window.scrollTo(0,0);return}
  const c=e.target.closest("[data-copiar]"); if(c){const t=c.parentElement.childNodes[2]?.textContent?.trim()||"";const txt=c.parentElement.innerText.replace(/^.*\n/,"").replace(/copiar$/,"").trim();(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{c.textContent="copiado ✓";setTimeout(()=>c.textContent="copiar",1500)}).catch(()=>{c.textContent="selecione e copie"});}
});
document.addEventListener("input",e=>{const t=e.target.closest("[data-obs]");if(t){dados[t.dataset.obs]={...(dados[t.dataset.obs]||{}),o:t.value};salvar();enfileirar(t.dataset.obs)}});
indexar();render();carregar();
</script>
</body>
</html>
