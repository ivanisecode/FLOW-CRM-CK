function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1800)}
async function copiar(txt, msg){
  try { await navigator.clipboard.writeText(txt); toast(msg || "copiado"); }
  catch(e){ const a=document.createElement("textarea"); a.value=txt; a.setAttribute("readonly",""); document.body.appendChild(a); a.select(); try{document.execCommand("copy"); toast(msg || "copiado");}catch(_){toast("segure o texto para copiar");} a.remove(); }
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const legendaCompleta = p => p.legenda + "\n\n" + TAGS;

/* ===== tarefas do dia ===== */
function tarefasDoDia(d){
  if (d === 0) return ANTES.map(a => ({id:"antes-"+a.id, nome:a.t}));
  const sem = new Date(ANO,MES,d).getDay(), l = [];
  postsGravar(d).forEach(p => { l.push({id:`${p.id}-gravado`, nome:`Gravar ${p.tipo}: ${p.item}`}); l.push({id:`${p.id}-agendado`, nome:`Agendar ${p.tipo}: ${p.item} (${ddmm(p.dia)}, ${p.hora})`}); });
  if (EXTRA[d]) l.push({id:`${d}-extra`, nome:"Extra do bloco de gravação"});
  postsDoDia(d).forEach(p => l.push({id:`${p.id}-publicado`, nome:`Conferir se saiu e compartilhar: ${p.tipo} ${p.item}`}));
  l.push({id:`${d}-manha`, nome:"Story da manhã"},{id:`${d}-tarde`, nome:"Story da tarde ("+TARDE[sem].tipo+")"},{id:`${d}-noite`, nome:"Story da noite"},{id:`${d}-status`, nome:"Stories no Status do WhatsApp"});
  if ([1,3,5].includes(sem)) l.push({id:`${d}-giro`, nome:"Story do Giro"});
  [0,1,2].forEach(i => { const c = (dados[`${d}-a${i}`]||{}).c; if (c && ACOES[c]) l.push({id:`${d}-a${i}`, nome:"Ação do dia: "+ACOES[c].n}); });
  if (SEMANA[sem]) l.push({id:`${d}-${SEMANA[sem].id}`, nome:SEMANA[sem].nome});
  l.push({id:`${d}-msgs`, nome:"Responder Direct, comentários e WhatsApp"},{id:`${d}-avaliacao`, nome:"Pós-venda do 8º ao 10º dia: está tudo bem? Se sim, avaliação no Google e prova social"});
  return l;
}
const contagem = d => { const l = tarefasDoDia(d); return [l.filter(t => st(t.id)==="feito").length, l.length]; };

/* ===== pendências: em andamento e não concluídas ===== */
function todasTarefas(){
  const l = [];
  for (let d=0; d<=30; d++) tarefasDoDia(d).forEach(t => l.push({...t, dia:d}));
  for (const k in CHECK) CHECK[k].itens.forEach(([id,n]) => l.push({id:`plano-${k}-${id}`, nome:`${CHECK[k].tit}: ${n}`, dia:-1, aba:(k==="reuniao"||k==="trafego")?"reuniao":"plano"}));
  return l;
}
function pendencias(){
  return todasTarefas().filter(t => ["andamento","nao"].includes(st(t.id)));
}

function viewCrono(){
  const primeiro = new Date(ANO,MES,1).getDay();
  let cel = CURTO.map(c => `<div class="cab">${c}</div>`).join("");
  for (let i=0;i<primeiro;i++) cel += "<div></div>";
  for (let d=1; d<=30; d++){
    const [f,t] = contagem(d);
    const temNao = tarefasDoDia(d).some(x => st(x.id)==="nao");
    const cls = (f===t?"cheio":f>0?"meio":"") + (ehHoje(d)?" hoje":"");
    const ps = postsDoDia(d);
    const marca = temNao ? "⚠" : postsGravar(d).length || EXTRA[d] ? "gravar" : ps.length ? ps.map(p => p.tipo.startsWith("Carrossel")?"carr":"reels").join("+") : "";
    cel += `<button type="button" class="${cls}" data-dia="${d}" aria-label="${d} de novembro, ${f} de ${t} feitas">${d}<small>${f}/${t}</small>${marca?`<small>${marca}</small>`:""}</button>`;
  }
  const pend = pendencias();
  let lista = "", semAtual = -1;
  POSTS.forEach(p => {
    const s = Math.floor((p.dia + primeiro - 1) / 7);

function resumoTexto(){
  const d = diaSel, l = tarefasDoDia(d);
  const marca = {inicio:"○",andamento:"◐",feito:"✓",nao:"✗"};
  const linhas = l.map(t => `${marca[st(t.id)]} ${t.nome}${st(t.id)!=="feito"&&st(t.id)!=="inicio"?" ("+NOME_ST[st(t.id)]+")":""}${obs(t.id)?"\n   obs: "+obs(t.id):""}`);
  const quando = d === 0 ? "preparação" : dataLonga(d);
  const f = l.filter(t => st(t.id)==="feito").length;
  return `Joice, clubkids Sinop (${quando})\nFeito: ${f} de ${l.length}\n\n${linhas.join("\n")}`;
}

    });
    enviado = {}; const base = retratoAtual();
    (r.itens || []).forEach(it => { if (base[it.item_id] && !pendente[it.item_id]) enviado[it.item_id] = base[it.item_id]; });
    try { localStorage.setItem(CHAVE, JSON.stringify(dados)); localStorage.setItem(CHAVE+"_enviado", JSON.stringify(enviado)); } catch(e) {}
    syncPronto = true;
    const y = window.scrollY; render(); window.scrollTo(0, y);
    enviarSync();
  } catch(e) {
    syncPronto = true;
    marcaSync("sem internet: salvo no celular");
    setTimeout(iniciarSync, 30000);
  }
}
render();
iniciarSync();
</script>
</body>
</html>
