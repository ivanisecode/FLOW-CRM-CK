name: RLS isolated PostgreSQL
on:
  push:
    branches: [dev/gestao-360-seguranca]
  pull_request:
    branches: [main]
jobs:
  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate RLS using disposable database
        run: sh experiments/test_rls.sh
