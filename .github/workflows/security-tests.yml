name: Security foundation checks
on:
  push:
    branches: [dev/gestao-360-seguranca]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --experimental-strip-types --test src/security/*.test.ts
